services:
  mongodb:
    image: mongo:8.2
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: development
    environment:
      NODE_ENV: development
      API_PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/job_board
      WEB_ORIGIN: http://localhost:5173
    ports: ["3000:3000"]
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: development
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    ports: ["5173:5173"]
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started

volumes:
  mongodb_data:
  api_node_modules:
  web_node_modules:
