name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:8.2
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RUN_MONGODB_TESTS: '1'
      MONGODB_URI: mongodb://127.0.0.1:27017/job_board_ci_test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:coverage
      - run: npm run build

  production-images:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build API production image
        run: >-
          docker build --file docker/api.Dockerfile --target production
          --build-arg APP_VERSION=0.1.0
          --build-arg APP_REVISION=${{ github.sha }}
          --tag job-board-api:${{ github.sha }} .
      - name: Build web production image
        run: >-
          docker build --file docker/web.Dockerfile --target production
          --build-arg VITE_API_BASE_URL=https://api.invalid
          --build-arg APP_VERSION=0.1.0
          --build-arg APP_REVISION=${{ github.sha }}
          --tag job-board-web:${{ github.sha }} .
